<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"/>
<title>Brickify — Stop alerts for this device</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 480px; margin: 64px auto; padding: 0 24px; text-align: center; color: #1e293b;
  }
  h2 { margin-bottom: 12px; }
  p { color: #475569; line-height: 1.5; }
  button {
    background: #83412C; color: #fff; border: none; border-radius: 8px;
    padding: 12px 24px; font-size: 16px; cursor: pointer; margin-top: 20px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: #b91c1c; }
</style>
</head>
<body>
  <div id="content">Loading…</div>

  <script>
    const FUNCTION_URL = 'https://vcqygndynttqakahuzzo.supabase.co/functions/v1/dismiss-alert';
    const params = new URLSearchParams(window.location.search);
    const deviceId = params.get('device_id');
    const token = params.get('token');
    const content = document.getElementById('content');

    function render(html) { content.innerHTML = html; }

    if (!deviceId || !token) {
      render('<h2>Missing link parameters</h2><p class="error">This link looks incomplete — please use the one from the alert email.</p>');
    } else {
      render(`
        <h2>Stop alerts for this device?</h2>
        <p>Brickify won't email you again about this device going silent or losing Device Admin, unless it starts checking in again.</p>
        <button id="confirmBtn">Yes, stop alerting me</button>
      `);
      document.getElementById('confirmBtn').addEventListener('click', async (e) => {
        const btn = e.target;
        btn.disabled = true;
        btn.textContent = 'Working…';
        try {
          const res = await fetch(FUNCTION_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ device_id: deviceId, token }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'request_failed');
          render('<h2>Got it 👍</h2><p>Brickify won\'t send any more alerts about this device unless it starts checking in again.</p>');
        } catch (err) {
          const message = err.message === 'invalid_token'
            ? 'This link is not valid or has been tampered with.'
            : 'Something went wrong. Please try again in a moment.';
          render(`<h2>Something went wrong</h2><p class="error">${message}</p>`);
        }
      });
    }
  </script>
</body>
</html>
